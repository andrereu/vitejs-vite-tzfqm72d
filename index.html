<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>MaternaIA • Plataforma Inteligente de Pré-Natal & Carteirinha Digital</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="theme-color" content="#2E482A" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carteirinha Pré-Natal — Dra. Priscila Gapski</title>
    <!-- Carrega o Tailwind CSS com todas as cores e estilos do projeto -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#F4F6F2]">
    <div id="root"></div>
    <script>
      // Console de depuração em tela, só quando a URL tem ?debug=1 — útil
      // pra ver erros em celular/tablet, sem precisar de F12 nem computador.
      // Remover quando não precisar mais.
      if (window.location.search.includes('debug=1')) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/eruda';
        s.onload = function () { eruda.init(); };
        document.body.appendChild(s);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
