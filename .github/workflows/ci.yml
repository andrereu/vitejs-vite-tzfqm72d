name: CI

# Roda em todo push e Pull Request, para pegar erro de teste/build antes
# de chegar na Vercel — hoje isso só era descoberto manualmente.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test
      - run: npm run build
